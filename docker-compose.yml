services:
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 enterprise.wsgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: enterprise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ecju2403=
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: