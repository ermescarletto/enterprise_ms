{% load static %}

<nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <button class="btn btn-outlined" id="toggleSidebar">☰ <img class="brand" src="{% static 'img/logo_maissabor.png' %}"></button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="#">Bem vindo, {{ user.username }}</a>
                        </li>
                        <li class="nav-item">
                            <button class="btn bg-danger btn-sm" id="logoutBtn"><i class="bi bi-lock-fill "></i></button>

                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'users:login' %}">Login</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1050;">
        <div id="logoutToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Confirmação</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                Você está saindo do sistema, deseja confirmar?
                <div class="mt-2 pt-2 border-top">
                    <button type="button" class="btn btn-danger btn-sm" id="confirmLogout">Sim</button>
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="toast">Não</button>
                </div>
            </div>
        </div>
    </div>
