{% extends "index.html" %}
{% block title %}
MS Enterprise - Usuários
{% endblock %}
{% block main %}

<div class="container mt-2">
    <div class="row">
        <div class="col-sm-12">
            <button class="btn btn-success btn-sm" id="create">+ Usuário</button>
        </div>
    </div>


</div>
<div class="container content mt-2">
    <table id="userTable" class="display">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>CPF</th>
                <th>Ativo</th>
                <th>Ações</th>
            </tr>
        </thead>
    </table>
</div>
<div class="modal fade" tabindex="-1" role="dialog" id="modal">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
        {% include 'users/form_generic.html' %}
    </div>
  </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', (e) => {
      modalForm(document.getElementById('create'), {
        formURL: "{% url 'users:create' %}"
      })
    });
    $(document).ready(function() {
        // Configuração da tabela DataTable
        $('#userTable').DataTable({
            "ajax": {
                "url": "/auth/users/list/",
                "type": "GET",
                "headers": {
                    "X-CSRFToken": "{{ csrf_token }}"
                }
            },
            "language": {
                "url": "https://cdn.datatables.net/plug-ins/1.12.1/i18n/pt-BR.json"
            },
            "columns": [
                { "data": "id" },
                { "data": "nome" },
                { "data": "email" },
                { "data": "cpf" },
                { "data": "ativo" },
                { "data": "acoes" },
            ]
        });
    });

$('#create-form').on('submit', function(event) {
    event.preventDefault(); // Impede o envio padrão do formulário

    // Pega os dados e converte em JSON
    const formData = {};
    $.each($(this).serializeArray(), function() {
        formData[this.name] = this.value;
    });
    const jsonData = JSON.stringify(formData);
    // Envia via AJAX
    $.ajax({
        url: '/sua-url',
        type: 'POST',
        contentType: 'application/json',
        data: jsonData,
        success: function(data) {
            console.log('Sucesso:', data);
            $('#seuModal').modal('hide'); // Fecha o modal, se desejar
        },
        error: function(error) {
            console.error('Erro:', error);
        }
    });
});
</script>
{% endblock %}
