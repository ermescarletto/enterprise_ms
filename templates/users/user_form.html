{% extends "index.html" %}

{% block main %}
<div class="container mt-4">
    <h2>{{ form.instance.pk|yesno:"Editar Usuário,Criar Usuário" }}</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="{% url 'users:list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
