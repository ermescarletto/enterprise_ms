<div class="container">
    <div class="row">
        <div class="col-md-5">
            <h5>Permissões disponíveis</h5>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="select-all-left">
                <label class="form-check-label" for="select-all-left">Selecionar todas</label>
            </div>
            <select id="available_permissions" multiple class="form-select" size="10">
                {% for perm in available_permissions %}
                    <option value="{{ perm.0 }}">{{ perm.1 }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2 d-flex flex-column justify-content-center align-items-center">
            <button type="button" class="btn btn-primary my-2" id="add_permission">→</button>
            <button type="button" class="btn btn-danger my-2" id="remove_permission">←</button>
        </div>
        <div class="col-md-5">
            <h5>Permissões adicionadas</h5>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="select-all-right">
                <label class="form-check-label" for="select-all-right">Selecionar todas</label>
            </div>
            <select id="selected_permissions" multiple class="form-select" size="10" name="{{ name }}" required>
                {% for perm in selected_permissions_list %}
                    <option value="{{ perm.0 }}" selected>{{ perm.1 }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const addBtn = document.getElementById("add_permission");
        const removeBtn = document.getElementById("remove_permission");
        const availablePermissions = document.getElementById("available_permissions");
        const selectedPermissions = document.getElementById("selected_permissions");
        const selectAllLeft = document.getElementById("select-all-left");
        const selectAllRight = document.getElementById("select-all-right");

        addBtn.addEventListener("click", function () {
            moveSelectedOptions(availablePermissions, selectedPermissions);
        });

        removeBtn.addEventListener("click", function () {
            moveSelectedOptions(selectedPermissions, availablePermissions);
        });

        selectAllLeft.addEventListener("click", function () {
            toggleAllOptions(availablePermissions, selectAllLeft.checked);
        });

        selectAllRight.addEventListener("click", function () {
            toggleAllOptions(selectedPermissions, selectAllRight.checked);
        });

        function moveSelectedOptions(from, to) {
            [...from.selectedOptions].forEach(option => {
                option.selected = false;
                to.appendChild(option);
            });
        }

        function toggleAllOptions(selectElement, checked) {
            for (let option of selectElement.options) {
                option.selected = checked;
            }
        }
    });
</script>
